<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusBite – Track order</title>
<style>body{font-family:system-ui;max-width:520px;margin:20px auto;padding:0 12px}.c{border:1px solid #ccd;border-radius:12px;padding:12px;margin:10px 0}
.bar{display:flex;gap:4px}.bar i{flex:1;height:6px;background:#dde;border-radius:3px}.bar i.d{background:#0b5563}img{width:180px;display:block;margin:8px 0}</style></head><body>
<h2>Track my orders</h2>
<div id="login"><input id="em" placeholder="email"> <input id="pw" type="password" placeholder="password"> <button onclick="signin()">Sign in</button></div>
<div id="list"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://YOUR-PROJECT.supabase.co', SB_ANON='YOUR-ANON-KEY', API='http://localhost:8000';
const sb=supabase.createClient(SB_URL,SB_ANON), ST=['placed','preparing','ready','collected'];
let jwt;
async function signin(){
  const {data,error}=await sb.auth.signInWithPassword({email:em.value,password:pw.value});
  if(error) return alert(error.message);
  jwt=data.session.access_token; login.hidden=true; await load();
  sb.channel('my-orders').on('postgres_changes',{event:'*',schema:'public',table:'orders'},load).subscribe(); // live updates
}
async function qr(id){const r=await fetch(`${API}/orders/${id}/qr`,{headers:{Authorization:'Bearer '+jwt}});return URL.createObjectURL(await r.blob())}
async function load(){
  const {data}=await sb.from('orders').select('*, order_items(*), outlets(name)').order('id',{ascending:false});
  list.innerHTML='';
  for(const o of data){
    const s=ST.indexOf(o.status), d=document.createElement('div'); d.className='c';
    d.innerHTML=`<b>${o.outlets.name}</b> · ₹${o.total} · ${o.status}<div class="bar">${ST.map((_,i)=>`<i class="${i<=s?'d':''}"></i>`).join('')}</div>`
      +o.order_items.map(i=>`<div>${i.name} × ${i.qty}</div>`).join('')
      +(o.status==='ready'?'<b>Ready! Show this QR at the counter</b>':'');
    if(o.status!=='collected'&&o.status!=='cancelled'){const im=new Image();im.src=await qr(o.id);d.appendChild(im)}
    list.appendChild(d);
  }
}
</script></body></html>
